<div class="candid-container">
  <div class="heading">Candid Wedding</div>

  <div class="tabs">
    <div class="tab" [class.active]="selectedTab === 'images'" (click)="selectTab('images')">
      Images
    </div>

    <div class="tab" [class.active]="selectedTab === 'videos'" (click)="selectTab('videos')">
      Videos
    </div>

    <div class="tab" [class.active]="selectedTab === 'packages'" (click)="selectTab('packages')">
      Packages
    </div>
  </div>

  <div class="tab-content">
    <div *ngIf="selectedTab === 'images'" class="images-tab">
      <div class="img-box" *ngFor="let img of images; let i = index">
        <img [src]="img" alt="Candid Image" />

        <div class="img-actions">
          <button class="edit-btn" (click)="edit(i, 'image')">
            <i class="bi bi-pencil"></i>
          </button>

          <button class="delete-btn" (click)="deleteItem(i, 'image')">
            <i class="bi bi-trash-fill"></i>
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="selectedTab === 'videos'" class="videos-tab">
      <div class="video-box" *ngFor="let v of videos; let i = index">
        <video controls [src]="v"></video>

        <div class="video-actions">
          <button class="edit-btn" (click)="edit(i, 'video')">
            <i class="bi bi-pencil"></i>
          </button>

          <button class="delete-btn" (click)="deleteItem(i, 'video')">
            <i class="bi bi-trash-fill"></i>
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="selectedTab === 'packages'" class="packages-tab">
      <div class="package-box" *ngFor="let p of packages">
        <div class="pname">{{ p.name }}</div>
        <div class="pprice">₹ {{ p.price }}</div>
      </div>
    </div>
  </div>
</div>
